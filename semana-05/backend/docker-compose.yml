# File Path: ./semana-05/backend/docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres-w05
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_db
    ports:
      - "5433:5432"
    volumes:
      - hotel_pgdata_w05:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotel_pgdata_w05: